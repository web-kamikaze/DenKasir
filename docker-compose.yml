version: '3.8'

services:
  # -------------------------------------------------------------
  # DATABASE POSTGRESQL 16
  # -------------------------------------------------------------
  postgres_db:
    image: postgres:16-alpine
    container_name: denkasir_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: denkasir_db
    ports:
      - "5432:5432"
    volumes:
      - denkasir_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d denkasir_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # BACKEND FASTAPI SERVER
  # -------------------------------------------------------------
  backend_api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: denkasir_api
    restart: always
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "DenKasir Server API"
      VERSION: "1.0.0"
      API_V1_STR: "/api/v1"
      SECRET_KEY: "denkasir_super_secret_jwt_key_production_2026"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "43200"
      POSTGRES_SERVER: "postgres_db"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password123"
      POSTGRES_DB: "denkasir_db"
      DATABASE_URL: "postgresql+asyncpg://postgres:password123@postgres_db:5432/denkasir_db"
      SYNC_DATABASE_URL: "postgresql://postgres:password123@postgres_db:5432/denkasir_db"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  denkasir_pgdata:
